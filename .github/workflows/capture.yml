name: capture-reference
on:
  push:
    branches: [tmp/reference-capture]
    paths: [".github/workflows/capture.yml", "capture.mjs"]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node capture.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add out
          git commit -m "Reference capture"
          git push
